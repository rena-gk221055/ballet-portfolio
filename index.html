<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>Canva Gallery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; max-width: 100%; margin: 0; padding: 0; overflow-x: hidden; background: #fff; }
    main { width: 100%; max-width: 100%; margin: 0; padding: 0; }
    img { display: block; width: 100%; max-width: 100%; height: auto; margin: 0; padding: 0; border: 0; }
  </style>
</head>
<body>
  <main>
    <img src="images/portfolio.png" alt="">
    <img src="images/report.png" alt="">
    <img src="images/ballet.png" alt="">
  </main>
</body>
</html>
